{% extends "base.html" %}
{% block tittel %}Logg inn{% endblock %}
{% block innhold %}
<main class="side logg-inn">
  <h1>Admin</h1>
  <span class="stemme">Bare for kjøkkenet.</span>
  {% if feil %}<p class="varsel feil">Feil passord.</p>{% endif %}
  <form method="post" action="/admin/logg-inn">
    <label>
      <span class="navn-paa-felt">Passord</span>
      <input type="password" name="passord" required autofocus autocomplete="current-password">
    </label>
    <button type="submit" class="bestill-knapp">Logg inn</button>
    <small>Passordet settes i <span class="mono">TP_ADMIN_PASSORD</span> i <span class="mono">.env</span> på Pi-en.</small>
  </form>
</main>
{% endblock %}
