{# Ett SVG-sprite, inkludert én gang per side. Alt tegnes i markup framfor å
   lastes som bilder: ingen ekstra forespørsler, skalerer fritt, og fargene
   arver paletten. Illustrasjonene slås opp på slug, så en ny pizza uten
   tegning bare får den nøytrale bunnen. #}
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>

    {# ---- Allergenikoner. Bare de kategoriene menyen faktisk bruker har en
           tegning; resten faller tilbake til ren tekst i malen. ---- #}
    <symbol id="al-gluten" viewBox="0 0 32 32">
      <line x1="16" y1="4" x2="16" y2="28" stroke="#B8863F" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M16,9 Q10,7 7,11 Q11,12 16,13 Q21,12 25,11 Q22,7 16,9 Z" fill="#D9AE5C" stroke="#8B6320" stroke-width=".8" stroke-linejoin="round"/>

    </symbol>

    <symbol id="al-melk" viewBox="0 0 32 32">
      <path d="M16,4 Q10,14 9,20 Q9,26 16,26 Q23,26 23,20 Q22,14 16,4 Z" fill="#FBF3DC" stroke="#1E140E" stroke-width="1.6" stroke-linejoin="round"/>
      <ellipse cx="13" cy="19" rx="2.4" ry="3.4" fill="#fff" opacity=".8"/>
    </symbol>

    {# ---- Basilikumbladet som pryder prikken over i-en i ordmerket. ---- #}
    <symbol id="basilikum" viewBox="0 0 22 30">
      <g transform="translate(11 13) rotate(28)">
        <path d="M0,-11 Q-7,-6 -6,3 Q-3,9 0,10 Q3,9 6,3 Q7,-6 0,-11 Z" fill="#4F6A2E" stroke="#2A3818" stroke-width=".5"/>

        <path d="M0,10 L0,15" stroke="#2A3818" stroke-width=".9" stroke-linecap="round"/>
      </g>
    </symbol>

    {# ---- Slett-ikonet i admin. ---- #}
    <symbol id="soppel" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h16M10 4h4a1 1 0 0 1 1 1v2H9V5a1 1 0 0 1 1-1Z"/>
      <path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/>
      <path d="M10 11v6M14 11v6"/>
    </symbol>

    {# ---- Pizzaene. Felles bunn, så én gruppe topping per rett.

           Osten er REVET og skinka er STRIMLET — det er det menyen lover, og
           det er det du får. Derfor er de tegnet som noen hundre små strek
           framfor hvite kuler (som ville lest som fersk mozzarella) og
           rosa flak (som ville lest som skiver).

           Strekene er generert med fast frø, ikke skrevet for hånd. Skal de
           tegnes om, endre generatoren og lim inn resultatet på nytt —
           ikke rediger enkeltlinjer her. ---- #}

      <circle cx="250" cy="250" r="205" fill="#E8D3A8" stroke="#B8955E" stroke-width="4"/>
    </symbol>
