<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="{% block temafarge %}#EFD1BB{% endblock %}">
<title>{% block tittel %}{{ innst.stedsnavn if innst else "Tyholt Pizzeria" }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{# SOFT-aksen maa staa i URL-en, ellers er font-variation-settings i stilarket
   en loegn: Google serverer bare de aksene som faktisk blir bedt om. #}
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/stil.css?v={{ statiskversjon }}">
{% block hode %}{% endblock %}
</head>
<body class="{% block kropp_klasse %}{% endblock %}">
{% include "_symboler.html" %}
{% block innhold %}{% endblock %}
{% block skript %}{% endblock %}
</body>
</html>
